{% if page_obj and page_obj.has_other_pages %}
<nav aria-label="{% if aria_label %}Paginación de {{ aria_label }}{% else %}Paginación{% endif %}" class="mt-3"><ul class="pagination pagination-sm flex-wrap mb-0">
  <li class="page-item{% if not page_obj.has_previous %} disabled{% endif %}">{% if page_obj.has_previous %}<a class="page-link" href="{% if url_anterior %}{{ url_anterior }}{% else %}?{% if filtros_query %}{{ filtros_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}{% endif %}">Anterior</a>{% else %}<span class="page-link" aria-disabled="true">Anterior</span>{% endif %}</li>
  <li class="page-item active" aria-current="page"><span class="page-link">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span></li>
  <li class="page-item{% if not page_obj.has_next %} disabled{% endif %}">{% if page_obj.has_next %}<a class="page-link" href="{% if url_siguiente %}{{ url_siguiente }}{% else %}?{% if filtros_query %}{{ filtros_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}{% endif %}">Siguiente</a>{% else %}<span class="page-link" aria-disabled="true">Siguiente</span>{% endif %}</li>
</ul></nav>{% endif %}
