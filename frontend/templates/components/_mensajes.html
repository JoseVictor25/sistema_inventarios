<div id="mensajes" aria-live="polite" aria-atomic="true">
{% for m in messages %}
  <div class="mensaje alert {% if m.level == DEFAULT_MESSAGE_LEVELS.ERROR %}alert-danger{% elif m.level == DEFAULT_MESSAGE_LEVELS.SUCCESS %}alert-success{% elif m.level == DEFAULT_MESSAGE_LEVELS.WARNING %}alert-warning{% else %}alert-info{% endif %} {{ m.tags }}" role="status">{{ m }}</div>
{% endfor %}
</div>
