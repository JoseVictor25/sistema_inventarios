<div class="modal fade" id="modal-qr" tabindex="-1" aria-labelledby="titulo-qr" data-imagen="{% url 'core:qr_imagen' %}">
<div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
<div class="modal-header"><h2 class="modal-title h5" id="titulo-qr">Cobro por QR</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
<div class="modal-body text-center"><p class="fs-4">Importe a pagar por QR: <span id="qr-moneda">Bs</span> <span id="qr-total"></span></p>
<p class="text-muted small">En pagos mixtos, transfiere únicamente el importe indicado arriba, no el total de la venta.</p>
<p id="qr-ausente" role="status">Cargando imagen bancaria…</p>
<img id="qr-imagen" class="img-fluid" hidden alt="QR bancario del negocio" style="width:100%;height:55vh;object-fit:contain">
<p class="mt-3">Mostrar o escanear el QR no confirma el pago. Verifica el ingreso en la cuenta antes de marcar la confirmación en el POS.</p></div>
<div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Volver al POS</button></div>
</div></div></div>
