{% extends 'base.html' %}
{% block titulo %}Configuración de impresión{% endblock %}
{% block contenido %}
<div class="card shadow-sm" style="max-width: 620px"><div class="card-body">
<h1 class="h4">Configuración de tickets</h1>
{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
<form method="post">{% csrf_token %}
<label for="ancho" class="form-label">Ancho de papel</label>
<select id="ancho" name="ancho" class="form-select mb-3"><option value="80" {% if impresion.ancho == 80 %}selected{% endif %}>80 mm</option><option value="58" {% if impresion.ancho == 58 %}selected{% endif %}>58 mm</option></select>
<label for="metodo" class="form-label">Método</label>
<select id="metodo" name="metodo" class="form-select mb-3"><option value="Windows" {% if impresion.metodo == 'Windows' %}selected{% endif %}>Controlador Windows</option><option value="ESC/POS" {% if impresion.metodo == 'ESC/POS' %}selected{% endif %}>ESC/POS (solo equipo compatible)</option></select>
<label for="impresora" class="form-label">Cola de impresión ESC/POS</label>
<select id="impresora" name="impresora" class="form-select mb-3"><option value="">Seleccione una cola</option>{% for cola in colas %}<option value="{{ cola }}" {% if cola == impresion.impresora %}selected{% endif %}>{{ cola }}</option>{% endfor %}</select>
<label class="form-check mb-2"><input class="form-check-input" type="checkbox" name="escpos_confirmado" {% if impresion.escpos_confirmado %}checked{% endif %}> Confirmo que esta cola acepta trabajos RAW ESC/POS</label>
<label for="alimentar" class="form-label">Líneas finales de alimentación (0–8)</label>
<input id="alimentar" name="alimentar_lineas" type="number" min="0" max="8" value="{{ impresion.alimentar_lineas }}" class="form-control mb-3">
<label class="form-check mb-2"><input class="form-check-input" type="checkbox" name="corte_automatico" {% if impresion.corte_automatico %}checked{% endif %}> Solicitar corte parcial (solo cortador comprobado)</label>
<label for="margen-superior" class="form-label">Margen superior (1–10 mm)</label>
<input id="margen-superior" name="margen_superior_mm" type="number" min="1" max="10" value="{{ impresion.margen_superior_mm }}" class="form-control mb-3">
<label for="margen-inferior" class="form-label">Margen inferior (2–15 mm)</label>
<input id="margen-inferior" name="margen_inferior_mm" type="number" min="2" max="15" value="{{ impresion.margen_inferior_mm }}" class="form-control mb-3">
<label class="form-check mb-2"><input class="form-check-input" type="checkbox" name="vista_previa" {% if impresion.vista_previa %}checked{% endif %}> Vista previa</label>
<label class="form-check mb-2"><input class="form-check-input" type="checkbox" name="ofrecer_al_finalizar" {% if impresion.ofrecer_al_finalizar %}checked{% endif %}> Ofrecer comprobante al terminar la venta</label>
<label class="form-check mb-2"><input class="form-check-input" type="checkbox" name="impresion_manual" {% if impresion.impresion_manual %}checked{% endif %}> Impresión manual</label>
<label for="mensaje" class="form-label mt-2">Mensaje de agradecimiento</label>
<input id="mensaje" name="mensaje" maxlength="120" value="{{ impresion.mensaje }}" class="form-control mb-3">
<button class="btn btn-primary" type="submit">Guardar</button>
</form></div></div>
{% endblock %}
